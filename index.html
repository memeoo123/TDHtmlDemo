<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略弹球棋子游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 24px; color: #e0e0ff; }
        #controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;

        #controls button {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;

        }

        #btn-resume { background: #5cb85c; color: #fff; }

<body>

    <div id="controls">
        <button id="btn-pause">暂停</button>
        <button id="btn-resume">继续</button>
        <button id="btn-reset">重置</button>
        <button id="btn-back">返回选关</button>
    </div>
    <div id="info">
        <span>分数: <strong id="score">0</strong></span>
        <span>突破: <strong id="breaches">0</strong></span>
        <span>士兵: <strong id="soldierCount">0</strong></span>
        <span>敌人: <strong id="enemyCount">0</strong></span>

    </div>
    <canvas id="gameCanvas" width="600" height="700"></canvas>

<script src="board-config.js"></script>
<script src="physics-config.js"></script>
<script src="balance-config.js"></script>
<script src="level-config.js"></script>

<script>
// ============================================================
// 弹球台配置
// ============================================================
const BoardConfig = {
    width: 600,
    height: 700,
    pinballAreaHeight: 500,
    groundAreaHeight: 200,
    groundY: 500,
    pinRows: 9,
    pinCols: 12,
    pinSpacingX: 45,
    pinSpacingY: 45,
    pinStartX: 45,
    pinStartY: 60,
    wallThickness: 10
};

// 如果外部 board-config.js 已加载，用它覆盖默认值
if (typeof BOARD_CONFIG_EXTERNAL !== 'undefined') {
    Object.assign(BoardConfig, BOARD_CONFIG_EXTERNAL);
    const cv = document.getElementById('gameCanvas');
    cv.width = BoardConfig.width;
    cv.height = BoardConfig.height;
}

// ============================================================
// 物理参数配置（内置默认值，可被外部 JSON 覆盖）
// ============================================================
const PhysicsConfig = {
    gravity: 0.15,
    pinCollisionDampening: 0.92,
    wallCollisionDampening: 0.9,
    ballRadius: 5,
    pinCollisionRadius: 13
};

// ============================================================
// 等级倍率配置（内置默认值，可被外部 JSON 覆盖）
// ============================================================
const LevelConfig = {
    multipliers: [1.0, 1.0, 1.3, 1.6, 2.0, 2.5],
    maxLevel: 5
};

// ============================================================
// 游戏平衡参数配置（内置默认值，可被外部 JSON 覆盖）
// ============================================================
const BalanceConfig = {
    meleeRange: 34,
    enemySpawnInterval: 3000,
    maxBalls: 100,
    maxSoldiers: 50,
    maxEnemies: 30,
    projectileRadius: 3,
    unitSize: 28
};

// ============================================================
// 棋子类型配置（内置默认值，可被外部 JSON 覆盖）
// ============================================================
let PIECE_TYPES = {
    FIRE: {
        name: '火战士',
        color: '#FF4444',
        fireInterval: 2000,
        ballSpeed: 3,
        combatType: 'melee',
        soldierHP: 5,
        soldierAttack: 2,
        soldierSpeed: 1.5,
        price: 10,
        skill: { name: '烈焰光环', type: 'aura', damagePerSecond: 0.5, radius: 40 }
    },
    ICE: {
        name: '冰法师',
        color: '#44AAFF',
        fireInterval: 3000,
        ballSpeed: 2,
        combatType: 'ranged',
        soldierHP: 3,
        soldierAttack: 1.5,
        soldierSpeed: 1,
        attackRange: 150,
        projectileSpeed: 4,
        attackInterval: 1000,
        price: 15,
        skill: { name: '冰霜减速', type: 'slow', slowFactor: 0.5, duration: 2000 }
    },
    THUNDER: {
        name: '雷战士',
        color: '#FFDD44',
        fireInterval: 1500,
        ballSpeed: 4,
        combatType: 'melee',
        soldierHP: 3,
        soldierAttack: 3,
        soldierSpeed: 2,
        price: 12,
        skill: { name: '连锁闪电', type: 'chain', chainCount: 2, chainDamageRatio: 0.5, chainRange: 60 }
    }
};
let PIECE_TYPE_LIST = Object.values(PIECE_TYPES);

// ============================================================
// PinPoint 点位类
// ============================================================
class PinPoint {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = PhysicsConfig.pinCollisionRadius;
        this.chessPiece = null;
    }
    isEmpty() {
        return this.chessPiece === null;
    }
    placePiece(type) {
        this.chessPiece = new ChessPiece(type, this);
    }
    removePiece() {
        this.chessPiece = null;
    }
}

// ============================================================
// ChessPiece 棋子类
// ============================================================
class ChessPiece {
    constructor(type, pinPoint, level = 1) {
        this.type = type;
        this.pinPoint = pinPoint;
        this.lastFireTime = 0;
        this.level = level;
    }

    // 等级倍率表：从 LevelConfig 读取
    static getLevelMultiplier(level) {
        return LevelConfig.multipliers[level] || 1.0;
    }

    // 获取升级后的有效属性
    getEffectiveStats() {
        const mult = ChessPiece.getLevelMultiplier(this.level);
        return {
            soldierHP: this.type.soldierHP * mult,
            soldierAttack: this.type.soldierAttack * mult,
            soldierSpeed: this.type.soldierSpeed * mult
        };
    }

    // 是否有技能（5级）
    hasSkill() {
        return this.level >= 5;
    }

    // 计算棋子总价值（合成所需的基础棋子数量 × 单价）
    static getTotalValue(pieceType, level) {
        const baseCount = Math.pow(2, level - 1);
        return baseCount * pieceType.price;
    }

    // 卖出价格 = 总价值 / 2
    static getSellPrice(pieceType, level) {
        return Math.floor(ChessPiece.getTotalValue(pieceType, level) / 2);
    }

    canFire(now) {
        return (now - this.lastFireTime) >= this.type.fireInterval;
    }
    fire(now) {
        if (!this.canFire(now)) return null;
        this.lastFireTime = now;
        // 随机方向发射
        const angle = Math.random() * Math.PI * 2;
        const speed = this.type.ballSpeed;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        // 合并基础配置与升级后的有效属性，确保 Soldier 继承增强数值
        const effectiveType = Object.assign({}, this.type, this.getEffectiveStats());
        // 5 级棋子的弹球携带技能
        if (this.hasSkill() && this.type.skill) {
            effectiveType.skill = this.type.skill;
        } else {
            delete effectiveType.skill;
        }
        return new Ball(this.pinPoint.x, this.pinPoint.y, vx, vy, effectiveType);
    }
}

// ============================================================
// Ball 棋子弹球类
// ============================================================
class Ball {
    constructor(x, y, vx, vy, type) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.type = type;
        this.radius = PhysicsConfig.ballRadius;
        this.alive = true;
    }
    update(dt) {
        if (!this.alive) return;
        this.vy += PhysicsConfig.gravity;
        this.x += this.vx;
        this.y += this.vy;
    }
    kill() {
        this.alive = false;
    }
}

// ============================================================
// Soldier 棋子士兵类
// ============================================================
class Soldier {
    constructor(x, groundY, type) {
        this.x = x;
        this.y = groundY;
        this.type = type;
        this.combatType = type.combatType;
        this.hp = type.soldierHP;
        this.maxHp = type.soldierHP;
        this.attack = type.soldierAttack;
        this.speed = type.soldierSpeed;
        this.attackRange = type.attackRange || 0;
        this.attackInterval = type.attackInterval || 0;
        this.projectileSpeed = type.projectileSpeed || 0;
        this.lastAttackTime = 0;
        this.alive = true;
        this.target = null;
        this.size = BalanceConfig.unitSize;
        this.direction = 1; // 士兵向右移动
        // 5 级棋子的弹球携带技能，传递给士兵
        this.skill = type.skill || null;
    }
    update(dt, enemies, now) {
        if (!this.alive) return;
        const behavior = COMBAT_BEHAVIORS[this.combatType];
        if (behavior) {
            behavior.findTarget(this, enemies);
            behavior.move(this, dt, { enemies: enemies });
        }
        // 超出右边界移除
        if (this.x > BoardConfig.width) {
            this.alive = false;
        }
    }
    takeDamage(dmg) {
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
        }
    }
}

// ============================================================
// 敌人类型配置（内置默认值，可被外部 JSON 覆盖）
// ============================================================
let ENEMY_TYPES = {
    GRUNT: {
        name: '步兵',
        color: '#AA3333',
        combatType: 'melee',
        hp: 6,
        attack: 1.5,
        speed: 1,
        score: 10
    },
    ARCHER: {
        name: '弓箭手',
        color: '#33AA33',
        combatType: 'ranged',
        hp: 3,
        attack: 1,
        speed: 0.8,
        attackRange: 120,
        projectileSpeed: 3,
        attackInterval: 1200,
        score: 15
    }
};
let ENEMY_TYPE_LIST = Object.values(ENEMY_TYPES);

// ============================================================
// Enemy 敌人类
// ============================================================
class Enemy {
    constructor(x, groundY, enemyType) {
        this.x = x;
        this.y = groundY;
        this.enemyType = enemyType;
        this.combatType = enemyType.combatType;
        this.hp = enemyType.hp;
        this.maxHp = enemyType.hp;
        this.attack = enemyType.attack;
        this.speed = enemyType.speed;
        this.attackRange = enemyType.attackRange || 0;
        this.attackInterval = enemyType.attackInterval || 0;
        this.projectileSpeed = enemyType.projectileSpeed || 0;
        this.lastAttackTime = 0;
        this.alive = true;
        this.target = null;
        this.size = BalanceConfig.unitSize;
        this.score = enemyType.score || 10;
        this.direction = -1; // 敌人向左移动
    }
    update(dt, soldiers, now) {
        if (!this.alive) return;
        // 检查减速效果过期
        if (this._slowExpiry && performance.now() >= this._slowExpiry) {
            if (this._originalSpeed) {
                this.speed = this._originalSpeed;
            }
            this._slowExpiry = null;
            this._slowFactor = null;
            this._originalSpeed = null;
        }
        const behavior = COMBAT_BEHAVIORS[this.combatType];
        if (behavior) {
            behavior.findTarget(this, soldiers);
            behavior.move(this, dt);
        }
    }
    takeDamage(dmg) {
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
        }
    }
}

// ============================================================
// Projectile 投射物类
// ============================================================
class Projectile {
    constructor(x, y, targetX, targetY, damage, speed, fromFriendly) {
        this.x = x;
        this.y = y;
        this.damage = damage;
        this.fromFriendly = fromFriendly;
        this.alive = true;
        this.radius = BalanceConfig.projectileRadius;
        const dx = targetX - x;
        const dy = targetY - y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        this.vx = (dx / dist) * speed;
        this.vy = (dy / dist) * speed;
    }
    update(dt) {
        if (!this.alive) return;
        this.x += this.vx;
        this.y += this.vy;
        // 超出边界移除
        if (this.x < 0 || this.x > BoardConfig.width || this.y < 0 || this.y > BoardConfig.height) {
            this.alive = false;
        }
    }
    checkHit(targets) {
        if (!this.alive) return;
        for (const t of targets) {
            if (!t.alive) continue;
            const dx = this.x - t.x;
            const dy = this.y - (t.y - t.size / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < this.radius + t.size / 2) {
                t.takeDamage(this.damage);
                this.alive = false;
                return t;
            }
        }
        return null;
    }
}

// ============================================================
// Combat 战斗系统
// ============================================================
class Combat {
    static get MELEE_RANGE() { return BalanceConfig.meleeRange; }

    static checkMeleeEngagement(soldiers, enemies) {
        for (const s of soldiers) {
            if (!s.alive) continue;
            const behavior = COMBAT_BEHAVIORS[s.combatType];
            if (!behavior) continue;
            for (const e of enemies) {
                if (!e.alive) continue;
                if (behavior.canEngage(s, e)) {
                    s.target = e;
                    const eBehavior = COMBAT_BEHAVIORS[e.combatType];
                    if (eBehavior && eBehavior.canEngage(e, s)) {
                        e.target = s;
                    }
                }
            }
        }
    }

    static processMeleeCombat(soldiers, enemies, dt) {
        for (const s of soldiers) {
            if (!s.alive || !s.target || !s.target.alive) continue;
            const behavior = COMBAT_BEHAVIORS[s.combatType];
            if (!behavior || !behavior.canEngage(s, s.target)) continue;
            // 只有近战型才在此处理伤害（远程由 processRangedAttacks 处理）
            if (s.combatType === 'melee') {
                const dmg = s.attack * dt / 1000;
                s.target.takeDamage(dmg);
                s.takeDamage(s.target.attack * dt / 1000);
                // 连锁闪电技能：攻击时跳跃到附近敌人
                if (s.skill && s.skill.type === 'chain' && behavior.applyChainLightning) {
                    behavior.applyChainLightning(s, s.target, dmg, enemies);
                }
            }
        }
        // 近战敌人主动攻击士兵（处理敌人锁定远程士兵等情况）
        for (const e of enemies) {
            if (!e.alive || e.combatType !== 'melee' || !e.target || !e.target.alive) continue;
            const eBehavior = COMBAT_BEHAVIORS[e.combatType];
            if (!eBehavior || !eBehavior.canEngage(e, e.target)) continue;
            // 避免与近战士兵重复计算（近战vs近战已在上面处理）
            if (e.target.combatType === 'melee') continue;
            const dmg = e.attack * dt / 1000;
            e.target.takeDamage(dmg);
        }
    }

    static processRangedAttacks(soldiers, enemies, projectiles, now) {
        // 所有远程单位（士兵和敌人）通过策略判定后发射投射物
        for (const s of soldiers) {
            if (!s.alive || s.combatType !== 'ranged' || !s.target || !s.target.alive) continue;
            const behavior = COMBAT_BEHAVIORS[s.combatType];
            if (!behavior || !behavior.canEngage(s, s.target)) continue;
            if ((now - s.lastAttackTime) >= s.attackInterval) {
                s.lastAttackTime = now;
                const proj = new Projectile(
                    s.x, s.y - s.size / 2,
                    s.target.x, s.target.y - s.target.size / 2,
                    s.attack, s.projectileSpeed, true
                );
                // 携带技能信息供命中时使用
                if (s.skill) {
                    proj._sourceSkill = s.skill;
                }
                projectiles.push(proj);
            }
        }
        for (const e of enemies) {
            if (!e.alive || e.combatType !== 'ranged' || !e.target || !e.target.alive) continue;
            const behavior = COMBAT_BEHAVIORS[e.combatType];
            if (!behavior || !behavior.canEngage(e, e.target)) continue;
            if ((now - e.lastAttackTime) >= e.attackInterval) {
                e.lastAttackTime = now;
                projectiles.push(new Projectile(
                    e.x, e.y - e.size / 2,
                    e.target.x, e.target.y - e.target.size / 2,
                    e.attack, e.projectileSpeed, false
                ));
            }
        }
    }

    static processProjectiles(projectiles, soldiers, enemies) {
        for (const p of projectiles) {
            if (!p.alive) continue;
            let hitTarget = null;
            if (p.fromFriendly) {
                hitTarget = p.checkHit(enemies);
            } else {
                hitTarget = p.checkHit(soldiers);
            }
            // 冰霜减速技能：投射物命中时减缓敌人速度
            if (hitTarget && p._sourceSkill && p._sourceSkill.type === 'slow') {
                const rangedBehavior = COMBAT_BEHAVIORS['ranged'];
                if (rangedBehavior && rangedBehavior.applySlowEffect) {
                    rangedBehavior.applySlowEffect({ skill: p._sourceSkill }, hitTarget);
                }
            }
        }
    }

    static cleanup(soldiers, enemies, projectiles) {
        // 返回新的过滤后数组
        return {
            soldiers: soldiers.filter(s => s.alive),
            enemies: enemies.filter(e => e.alive),
            projectiles: projectiles.filter(p => p.alive)
        };
    }
}

// ============================================================
// 初始棋子布局配置（内置默认值，可被外部 JS 覆盖）

let INITIAL_LAYOUT = [
    { row: 0, col: 3, type: 'FIRE' },

// 如果外部 initial-layout.js 已加载，用它覆盖默认值
if (typeof INITIAL_LAYOUT_EXTERNAL !== 'undefined') {

// ============================================================
// 波次配置（内置默认值，可被外部 JSON 覆盖）
// ============================================================
let WAVE_CONFIGS = [
    {
        wave: 1,
        enemies: [
            { type: 'GRUNT', count: 5 }
        ],
        spawnInterval: 3000
    },
    {
        wave: 2,
        enemies: [
            { type: 'GRUNT', count: 5 },
            { type: 'ARCHER', count: 3 }
        ],
        spawnInterval: 2500
    },
    {
        wave: 3,
        enemies: [
            { type: 'GRUNT', count: 8 },
            { type: 'ARCHER', count: 5 }

        spawnInterval: 2000
    }
];

// ============================================================
// WaveManager 波次管理器
// ============================================================
class WaveManager {
    constructor(waveConfigs) {
        this.waveConfigs = waveConfigs || WAVE_CONFIGS;
        this.currentWave = 1;
        this.totalWaves = this.waveConfigs.length;
        this.phase = 'shop'; // 'shop' | 'combat'
        this.enemySpawnTimer = 0;
        this.enemySpawnInterval = BalanceConfig.enemySpawnInterval;
        this.enemySpawnQueue = []; // 待生成的敌人类型队列
        this.totalEnemiesThisWave = 0;
        this.spawnedCount = 0;
        // 回调：清理战场（由 Game 设置）
        this.onClearBattlefield = null;
    }

    startShopPhase() {
        this.phase = 'shop';
        this.enemySpawnTimer = 0;
        this.enemySpawnQueue = [];
        this.spawnedCount = 0;
        // 通知 Game 清理战场残留
        if (this.onClearBattlefield) {
            this.onClearBattlefield();
        }
    }

    startCombatPhase() {
        this.phase = 'combat';
        this.enemySpawnTimer = 0;
        this.spawnedCount = 0;
        // 初始化当前波次的敌人生成队列
        const config = this.getCurrentWaveConfig();
        if (!config) return;
        this.enemySpawnInterval = config.spawnInterval;
        this.enemySpawnQueue = [];
        for (const entry of config.enemies) {
            for (let i = 0; i < entry.count; i++) {
                this.enemySpawnQueue.push(entry.type);
            }
        }
        this.totalEnemiesThisWave = this.enemySpawnQueue.length;
    }

    update(dt, enemies) {
        if (this.phase !== 'combat') return null;
        // 按 spawnInterval 生成敌人
        if (this.enemySpawnQueue.length > 0) {
            this.enemySpawnTimer += dt;
            if (this.enemySpawnTimer >= this.enemySpawnInterval) {
                this.enemySpawnTimer = 0;
                const typeName = this.enemySpawnQueue.shift();
                this.spawnedCount++;
                const enemyType = ENEMY_TYPES[typeName];
                if (enemyType) {
                    return enemyType; // 返回要生成的敌人类型
                }
            }
        }
        return null;
    }

    isWaveComplete(enemies) {
        // 所有敌人已生成且场上无存活敌人
        return this.enemySpawnQueue.length === 0 &&
               this.spawnedCount >= this.totalEnemiesThisWave &&
               enemies.filter(e => e.alive).length === 0;
    }

    isGameComplete(enemies) {
        return this.currentWave >= this.totalWaves && this.isWaveComplete(enemies);
    }

    nextWave() {
        if (this.currentWave < this.totalWaves) {
            this.currentWave++;
            this.startShopPhase();
            return true;
        }
        return false;
    }

    getCurrentWaveConfig() {
        if (this.currentWave <= this.waveConfigs.length) {
            return this.waveConfigs[this.currentWave - 1];
        }
        return null;
    }

    getWaveEnemies() {
        const config = this.getCurrentWaveConfig();
        return config ? config.enemies : [];
    }
}

// ============================================================
// Shop 商店系统
// ============================================================
class Shop {
    constructor(initialGold = 50) {
        this.gold = initialGold;
        this.selectedPiece = null;
    }

    getGold() {
        return this.gold;
    }

    addGold(amount) {
        if (amount > 0) {
            this.gold += amount;
        }
    }

    canAfford(pieceType) {
        return pieceType && typeof pieceType.price === 'number' && this.gold >= pieceType.price;
    }

    buyPiece(pieceType) {
        if (!this.canAfford(pieceType)) return false;
        this.gold -= pieceType.price;
        this.selectedPiece = pieceType;
        return true;
    }

    refundPiece(pieceType) {
        if (pieceType && typeof pieceType.price === 'number') {
            this.gold += pieceType.price;
        }
    }

    sellPiece(pieceType, level) {
        if (pieceType && typeof pieceType.price === 'number') {
            const sellPrice = ChessPiece.getSellPrice(pieceType, level);
            this.gold += sellPrice;
            return sellPrice;
        }
        return 0;
    }

    clearSelection() {
        this.selectedPiece = null;
    }
}

// ============================================================
// Physics 物理系统
// ============================================================
class Physics {
    static get GRAVITY() { return PhysicsConfig.gravity; }

    static checkPinCollision(ball, pin) {
        const dx = ball.x - pin.x;
        const dy = ball.y - pin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = ball.radius + pin.radius;
        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x = pin.x + nx * minDist;
            ball.y = pin.y + ny * minDist;
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            ball.vx *= PhysicsConfig.pinCollisionDampening;
            ball.vy *= PhysicsConfig.pinCollisionDampening;
            return true;
        }
        return false;
    }

    static checkWallCollision(ball, bounds) {
        const t = BoardConfig.wallThickness;
        const damp = PhysicsConfig.wallCollisionDampening;
        if (ball.x - ball.radius < t) {
            ball.x = t + ball.radius;
            ball.vx = Math.abs(ball.vx) * damp;
        }
        if (ball.x + ball.radius > bounds.width - t) {
            ball.x = bounds.width - t - ball.radius;
            ball.vx = -Math.abs(ball.vx) * damp;
        }
        if (ball.y - ball.radius < t) {
            ball.y = t + ball.radius;
            ball.vy = Math.abs(ball.vy) * damp;
        }
    }

    static checkBallCollision(b1, b2) {
        if (!b1.alive || !b2.alive) return false;
        const dx = b2.x - b1.x;
        const dy = b2.y - b1.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = b1.radius + b2.radius;
        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = minDist - dist;
            b1.x -= nx * overlap / 2;
            b1.y -= ny * overlap / 2;
            b2.x += nx * overlap / 2;
            b2.y += ny * overlap / 2;
            const dvx = b1.vx - b2.vx;
            const dvy = b1.vy - b2.vy;
            const dvDotN = dvx * nx + dvy * ny;
            if (dvDotN > 0) {
                b1.vx -= dvDotN * nx;
                b1.vy -= dvDotN * ny;
                b2.vx += dvDotN * nx;
                b2.vy += dvDotN * ny;
            }
            return true;
        }
        return false;
    }

    static checkGroundCollision(ball, groundY) {
        if (ball.y + ball.radius >= groundY) {
            ball.kill();
            return true;
        }
        return false;
    }
}

// ============================================================
// Renderer 渲染器
// ============================================================
class Renderer {
    constructor(ctx) {
        this.ctx = ctx;
    }

    clear() {
        this.ctx.clearRect(0, 0, BoardConfig.width, BoardConfig.height);
    }

    drawBoard() {
        const ctx = this.ctx;
        const w = BoardConfig.width;
        const h = BoardConfig.height;
        const t = BoardConfig.wallThickness;

        ctx.fillStyle = '#0f0f23';
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#334';
        ctx.fillRect(0, 0, t, h);
        ctx.fillRect(w - t, 0, t, h);
        ctx.fillRect(0, 0, w, t);

        ctx.strokeStyle = '#556';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(t, BoardConfig.groundY);
        ctx.lineTo(w - t, BoardConfig.groundY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = 'rgba(34, 40, 34, 0.5)';
        ctx.fillRect(t, BoardConfig.groundY, w - 2 * t, BoardConfig.groundAreaHeight);
    }

    drawPinPoint(pin, isMovingSource, isDragTarget) {
        const ctx = this.ctx;
        ctx.beginPath();
        ctx.arc(pin.x, pin.y, pin.radius, 0, Math.PI * 2);
        if (pin.isEmpty()) {
            // 拖拽中高亮有效的空目标点位
            if (isDragTarget) {
                ctx.fillStyle = 'rgba(100, 255, 100, 0.3)';
                ctx.fill();
                ctx.strokeStyle = '#8f8';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                ctx.fillStyle = '#667';
                ctx.fill();
                ctx.strokeStyle = '#889';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        } else {
            const color = pin.chessPiece.type.color;
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(pin.x, pin.y, pin.radius + 4, 0, Math.PI * 2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 棋子名称
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(pin.chessPiece.type.name[0], pin.x, pin.y + 4);
            // 等级标识
            const level = pin.chessPiece.level;
            ctx.fillStyle = level >= 5 ? '#FFD700' : '#ccc';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Lv.' + level, pin.x, pin.y - pin.radius - 3);
        }
        // 选中待移动的棋子高亮（拖拽源）
        if (isMovingSource && !pin.isEmpty()) {
            ctx.beginPath();
            ctx.arc(pin.x, pin.y, pin.radius + 7, 0, Math.PI * 2);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(pin.x, pin.y, pin.radius + 10, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    drawLevelSelectScreen(stages, canvasEl) {
        const ctx = this.ctx;
        const w = canvasEl.width;
        const h = canvasEl.height;

        // 背景
        ctx.fillStyle = '#0f0f23';
        ctx.fillRect(0, 0, w, h);

        // 标题
        ctx.fillStyle = '#e0e0ff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('选择关卡', w / 2, 60);

        // 关卡卡片
        const cardW = 260;
        const cardH = 70;
        const gap = 16;
        const startY = 110;
        this._stageButtons = [];

        for (let i = 0; i < stages.length; i++) {
            const stage = stages[i];
            const cx = w / 2 - cardW / 2;
            const cy = startY + i * (cardH + gap);

            // 卡片背景
            ctx.fillStyle = 'rgba(30, 30, 60, 0.9)';
            ctx.strokeStyle = '#88a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(cx, cy, cardW, cardH, 8);
            ctx.fill();
            ctx.stroke();

            // 关卡编号
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('第 ' + stage.id + ' 关', cx + 16, cy + 30);

            // 关卡名称
            ctx.fillStyle = '#ccc';
            ctx.font = '16px sans-serif';
            ctx.fillText(stage.name, cx + 16, cy + 54);

            // 波次数量提示
            const waveCount = stage.waveConfig ? stage.waveConfig.length : 0;
            ctx.fillStyle = '#888';
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(waveCount + ' 波', cx + cardW - 16, cy + 44);

            this._stageButtons.push({ x: cx, y: cy, w: cardW, h: cardH, index: i });
        }
    }

    drawDragPreview(dragManager) {
        if (!dragManager.isDragging || !dragManager.dragPreviewPos) return;
        const ctx = this.ctx;
        const pos = dragManager.dragPreviewPos;
        const source = dragManager.dragSource;
        let color = '#fff';
        let label = '';

        if (source.type === 'shop') {
            color = source.pieceType.color;
            label = source.pieceType.name[0];
        } else if (source.type === 'pin' && source.pin && !source.pin.isEmpty()) {
            color = source.pin.chessPiece.type.color;
            label = source.pin.chessPiece.type.name[0];
        }

        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        if (label) {
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, pos.x, pos.y + 3);
        }
        ctx.globalAlpha = 1.0;
    }

    drawBall(ball) {
        if (!ball.alive) return;
        const ctx = this.ctx;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = (ball.type && ball.type.color) ? ball.type.color : '#ddf';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    drawSoldier(soldier) {
        if (!soldier.alive) return;
        const ctx = this.ctx;
        const renderer = COMBAT_RENDERERS[soldier.combatType];
        if (renderer) {
            renderer.drawSoldier(ctx, soldier);
        }
        // 生命值条
        this.drawHealthBar(soldier.x, soldier.y - soldier.size - 6, soldier.size, 3, soldier.hp, soldier.maxHp, '#0f0');
    }

    drawHealthBar(x, y, width, height, hp, maxHp, color) {
        const ctx = this.ctx;
        const ratio = Math.max(0, hp / maxHp);
        ctx.fillStyle = '#333';
        ctx.fillRect(x - width / 2, y, width, height);
        ctx.fillStyle = ratio > 0.5 ? color : (ratio > 0.25 ? '#ff0' : '#f00');
        ctx.fillRect(x - width / 2, y, width * ratio, height);
    }

    drawEnemy(enemy) {
        if (!enemy.alive) return;
        const ctx = this.ctx;
        const renderer = COMBAT_RENDERERS[enemy.combatType];
        if (renderer) {
            renderer.drawEnemy(ctx, enemy);
        }
        this.drawHealthBar(enemy.x, enemy.y - enemy.size - 6, enemy.size, 3, enemy.hp, enemy.maxHp, '#f44');
    }

    drawProjectile(proj) {
        if (!proj.alive) return;
        const ctx = this.ctx;
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
        ctx.fillStyle = proj.fromFriendly ? '#8ff' : '#f88';
        ctx.fill();
    }

    drawSelectionPanel(panel) {
        const ctx = this.ctx;
        const types = PIECE_TYPE_LIST;
        const pw = 140;
        const ph = 30 * types.length + 40;
        let px = panel.x - pw / 2;
        let py = panel.y - ph - 15;

        // 确保面板在画布内
        if (px < 5) px = 5;
        if (px + pw > BoardConfig.width - 5) px = BoardConfig.width - pw - 5;
        if (py < 5) py = panel.y + 15;

        // 背景
        ctx.fillStyle = 'rgba(20, 20, 40, 0.92)';
        ctx.strokeStyle = '#88a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(px, py, pw, ph, 6);
        ctx.fill();
        ctx.stroke();

        // 标题
        ctx.fillStyle = '#ccc';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('选择棋子类型', px + pw / 2, py + 18);

        // 选项
        panel.buttons = [];
        for (let i = 0; i < types.length; i++) {
            const bx = px + 10;
            const by = py + 28 + i * 30;
            const bw = pw - 20;
            const bh = 24;

            ctx.fillStyle = types[i].color;
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 4);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(types[i].name, bx + bw / 2, by + 16);

            panel.buttons.push({ x: bx, y: by, w: bw, h: bh, type: types[i] });
        }
    }

    drawShopPanel(shop, waveManager) {
        const ctx = this.ctx;
        const types = PIECE_TYPE_LIST;
        const keys = Object.keys(PIECE_TYPES);
        const panelW = 160;
        const itemH = 36;
        const headerH = 32;
        const footerH = 36;
        const panelH = headerH + itemH * types.length + footerH + 8;
        const px = BoardConfig.width - panelW - 4;
        const py = 4;

        // 背景
        ctx.fillStyle = 'rgba(15, 15, 35, 0.93)';
        ctx.strokeStyle = '#88a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(px, py, panelW, panelH, 6);
        ctx.fill();
        ctx.stroke();

        // 标题 + 金币
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('🪙 ' + shop.getGold(), px + 10, py + 22);
        ctx.fillStyle = '#ccc';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('商店', px + panelW - 10, py + 22);

        // 棋子列表
        this._shopButtons = [];
        for (let i = 0; i < types.length; i++) {
            const t = types[i];
            const bx = px + 8;
            const by = py + headerH + i * itemH;
            const bw = panelW - 16;
            const bh = itemH - 4;
            const affordable = shop.canAfford(t);

            // 按钮背景
            ctx.fillStyle = affordable ? 'rgba(40, 40, 70, 0.9)' : 'rgba(30, 30, 40, 0.6)';
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 4);
            ctx.fill();

            // 左侧色块
            ctx.fillStyle = affordable ? t.color : '#555';
            ctx.fillRect(bx + 4, by + 5, 8, bh - 10);

            // 名称
            ctx.fillStyle = affordable ? '#eee' : '#666';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(t.name, bx + 18, by + bh / 2 + 4);

            // 价格
            ctx.fillStyle = affordable ? '#FFD700' : '#555';
            ctx.textAlign = 'right';
            ctx.fillText('🪙' + t.price, bx + bw - 6, by + bh / 2 + 4);

            // 选中高亮
            if (shop.selectedPiece === t) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 4);
                ctx.stroke();
            }

            this._shopButtons.push({ x: bx, y: by, w: bw, h: bh, type: t, key: keys[i], affordable: affordable });
        }

        // "开始战斗" 按钮
        const btnX = px + 8;
        const btnY = py + headerH + types.length * itemH + 4;
        const btnW = panelW - 16;
        const btnH = 28;
        ctx.fillStyle = '#5cb85c';
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 4);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚔ 开始战斗', btnX + btnW / 2, btnY + btnH / 2 + 5);

        this._startCombatBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
    }

    drawWaveInfo(waveManager, enemies) {
        const ctx = this.ctx;
        const phaseText = waveManager.phase === 'shop' ? '购买摆放阶段' : '战斗阶段';
        const waveText = '波次 ' + waveManager.currentWave + '/' + waveManager.totalWaves;

        // 顶部信息条背景
        ctx.fillStyle = 'rgba(15, 15, 35, 0.8)';
        ctx.fillRect(BoardConfig.wallThickness, BoardConfig.wallThickness, 200, 22);

        ctx.fillStyle = '#e0e0ff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(waveText + '  |  ' + phaseText, BoardConfig.wallThickness + 6, BoardConfig.wallThickness + 16);

        // 战斗阶段显示剩余敌人
        if (waveManager.phase === 'combat') {
            const remaining = waveManager.enemySpawnQueue.length + enemies.filter(e => e.alive).length;
            ctx.fillStyle = '#f88';
            ctx.font = '11px sans-serif';
            ctx.fillText('剩余敌人: ' + remaining, BoardConfig.wallThickness + 6, BoardConfig.wallThickness + 36);
        }
    }
}

// ============================================================
// DragManager 拖拽管理器
// ============================================================
class DragManager {
    constructor(game) {
        this.game = game;
        this.dragSource = null;   // { type: 'shop'|'pin', pieceType?, pin? }
        this.isDragging = false;
        this.dragPreviewPos = null; // { x, y }
    }

    startDragFromShop(pieceType) {
        this.dragSource = { type: 'shop', pieceType: pieceType };
        this.isDragging = true;
        this.dragPreviewPos = null;
    }

    startDragFromPin(pin) {
        this.dragSource = { type: 'pin', pin: pin };
        this.isDragging = true;
        this.dragPreviewPos = null;
    }

    updateDragPosition(x, y) {
        if (this.isDragging) {
            this.dragPreviewPos = { x, y };
        }
    }

    endDrag(targetPin, isShopArea) {
        if (!this.isDragging || !this.dragSource) {
            this.cancelDrag();
            return false;
        }

        const game = this.game;
        const isShopPhase = game.waveManager && game.waveManager.phase === 'shop';
        const source = this.dragSource;
        let result = false;

        if (source.type === 'shop') {
            // 从商店拖拽
            if (!isShopPhase) {
                // 战斗阶段禁止从商店购买
                this.cancelDrag();
                return false;
            }
            if (targetPin) {
                if (targetPin.isEmpty()) {
                    // 拖拽到空点位 → 购买放置
                    if (game.shop.canAfford(source.pieceType)) {
                        game.shop.gold -= source.pieceType.price;
                        targetPin.placePiece(source.pieceType);
                        result = true;
                    }
                } else {
                    // 拖拽到已有棋子点位 → 尝试升级（购买+合并）
                    const targetPiece = targetPin.chessPiece;
                    if (targetPiece.type === source.pieceType &&
                        targetPiece.level === 1 &&
                        targetPiece.level < 5 &&
                        game.shop.canAfford(source.pieceType)) {
                        game.shop.gold -= source.pieceType.price;
                        targetPiece.level += 1;
                        result = true;
                    }
                }
            }
        } else if (source.type === 'pin') {
            // 从点位拖拽
            const sourcePin = source.pin;
            if (!sourcePin || sourcePin.isEmpty()) {
                this.cancelDrag();
                return false;
            }

            if (isShopArea) {
                // 拖拽到商店区域 → 卖出
                if (isShopPhase) {
                    const piece = sourcePin.chessPiece;
                    game.shop.sellPiece(piece.type, piece.level);
                    sourcePin.removePiece();
                    result = true;
                }
                // 战斗阶段禁止卖出，棋子回原位
            } else if (targetPin) {
                if (targetPin === sourcePin) {
                    // 拖回原位，无操作
                } else if (targetPin.isEmpty()) {
                    // 拖拽到空点位 → 移动
                    game.movePiece(sourcePin, targetPin);
                    result = true;
                } else {
                    // 拖拽到已有棋子点位
                    const sourcePiece = sourcePin.chessPiece;
                    const targetPiece = targetPin.chessPiece;
                    if (sourcePiece.type === targetPiece.type &&
                        sourcePiece.level === targetPiece.level &&
                        sourcePiece.level < 5) {
                        // 同类型同等级 → 升级（两个阶段都允许）
                        targetPiece.level += 1;
                        sourcePin.chessPiece = null;
                        result = true;
                    } else {
                        // 不同类型或不同等级 → 交换位置
                        game.swapPieces(sourcePin, targetPin);
                        result = true;
                    }
                }
            }
        }

        this.isDragging = false;
        this.dragSource = null;
        this.dragPreviewPos = null;
        return result;
    }

    cancelDrag() {
        this.isDragging = false;
        this.dragSource = null;
        this.dragPreviewPos = null;
    }
}

// ============================================================
// Game 游戏主控制器
// ============================================================
class Game {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        if (!this.ctx) {
            alert('浏览器不支持 Canvas 2D 上下文');
            return;
        }
        this.renderer = new Renderer(this.ctx);
        this.status = 'running';
        this.pinPoints = [];
        this.balls = [];
        this.soldiers = [];
        this.enemies = [];
        this.projectiles = [];
        this.score = 0;
        this.breaches = 0;
        this.lastTime = 0;
        this.animFrameId = null;
        this.selectionPanel = null;
        this.gameWon = false;
        this.shop = new Shop(50);
        this._mousePos = null;
        this.movingPiece = null;
        this.dragManager = new DragManager(this);
        this.waveManager = new WaveManager(WAVE_CONFIGS);
        this.gameScreen = 'level-select'; // 'level-select' | 'playing'
        this.stages = [];
        this.currentStageIndex = -1;
        this.waveManager.onClearBattlefield = () => {
            this.balls = [];
            this.soldiers = [];
            this.enemies = [];
            this.projectiles = [];
        };
    }

    init() {
        this.pinPoints = [];
        this.balls = [];
        this.soldiers = [];
        this.enemies = [];
        this.projectiles = [];
        this.score = 0;
        this.breaches = 0;
        this.gameWon = false;
        this.movingPiece = null;
        if (this.dragManager) this.dragManager.cancelDrag();

        // 重新初始化波次管理器（确保使用最新配置）
        this.waveManager = new WaveManager(WAVE_CONFIGS);
        this.waveManager.onClearBattlefield = () => {
            this.balls = [];
            this.soldiers = [];
            this.enemies = [];
            this.projectiles = [];
        };
        this.shop = new Shop(50);

        // 生成点位（交错排列）
        for (let row = 0; row < BoardConfig.pinRows; row++) {
            const offsetX = (row % 2 === 1) ? BoardConfig.pinSpacingX / 2 : 0;
            const cols = (row % 2 === 1) ? BoardConfig.pinCols - 1 : BoardConfig.pinCols;
            for (let col = 0; col < cols; col++) {
                const x = BoardConfig.pinStartX + col * BoardConfig.pinSpacingX + offsetX;
                const y = BoardConfig.pinStartY + row * BoardConfig.pinSpacingY;
                this.pinPoints.push(new PinPoint(x, y));
            }
        }

        // 预置一些棋子在点位上
        this._placeInitialPieces();
    }

    _placeInitialPieces() {
        for (const p of INITIAL_LAYOUT) {
            const pieceType = PIECE_TYPES[p.type];
            if (!pieceType) continue;
            const idx = this._getPinIndex(p.row, p.col);
            if (idx >= 0 && idx < this.pinPoints.length) {
                this.pinPoints[idx].placePiece(pieceType);
            }
        }
    }

    _getPinIndex(row, col) {
        let idx = 0;
        for (let r = 0; r < row; r++) {
            idx += (r % 2 === 1) ? BoardConfig.pinCols - 1 : BoardConfig.pinCols;
        }
        return idx + col;
    }

    movePiece(sourcePin, targetPin) {
        if (sourcePin.isEmpty() || !targetPin.isEmpty()) return false;
        const piece = sourcePin.chessPiece;
        sourcePin.chessPiece = null;
        targetPin.chessPiece = piece;
        piece.pinPoint = targetPin;
        return true;
    }

    mergePieces(sourcePin, targetPin) {
        if (this.waveManager.phase !== 'shop') return false;
        if (sourcePin.isEmpty() || targetPin.isEmpty()) return false;

        const sourcePiece = sourcePin.chessPiece;
        const targetPiece = targetPin.chessPiece;

        // 类型和等级必须相同
        if (sourcePiece.type !== targetPiece.type) return false;
        if (sourcePiece.level !== targetPiece.level) return false;

        // 等级上限检查
        if (sourcePiece.level >= 5) return false;

        // 执行合并：目标点位棋子升级，源点位清空
        targetPiece.level += 1;
        sourcePin.chessPiece = null;

        return true;
    }

    swapPieces(pinA, pinB) {
        const pieceA = pinA.chessPiece;
        const pieceB = pinB.chessPiece;
        pinA.chessPiece = pieceB;
        pinB.chessPiece = pieceA;
        if (pieceA) pieceA.pinPoint = pinB;
        if (pieceB) pieceB.pinPoint = pinA;
    }

    selectStage(stageIndex) {
        const stage = this.stages[stageIndex];
        if (!stage) return;

        this.currentStageIndex = stageIndex;

        // 用关卡的 boardConfig 覆盖当前弹球台配置
        if (stage.boardConfig) {
            Object.assign(BoardConfig, stage.boardConfig);
            this.canvas.width = BoardConfig.width;
            this.canvas.height = BoardConfig.height;
        }

        // 用关卡的 waveConfig 覆盖波次配置
        if (stage.waveConfig) {
            WAVE_CONFIGS = stage.waveConfig;
        }

        // 重新初始化游戏
        this.init();

        // 用关卡的 initialGold 覆盖商店初始金币
        if (typeof stage.initialGold === 'number' && stage.initialGold >= 0) {
            this.shop.gold = stage.initialGold;
        }

        // 切换到游戏画面
        this.gameScreen = 'playing';
        this.waveManager.startShopPhase();
    }

    returnToLevelSelect() {
        this.status = 'paused';
        if (this.animFrameId) {
            cancelAnimationFrame(this.animFrameId);
            this.animFrameId = null;
        }
        this.gameScreen = 'level-select';
        this.currentStageIndex = -1;
        this.pinPoints = [];
        this.balls = [];
        this.soldiers = [];
        this.enemies = [];
        this.projectiles = [];
        this.score = 0;
        this.breaches = 0;
        this.gameWon = false;
        this.selectionPanel = null;
        this.movingPiece = null;
        if (this.dragManager) this.dragManager.cancelDrag();
        this.render();
        this._updateUI();
    }

    start() {
        this.status = 'running';
        this.lastTime = performance.now();
        this._loop(this.lastTime);
    }

    pause() {
        this.status = 'paused';
    }

    resume() {
        if (this.status === 'paused') {
            this.status = 'running';
            this.lastTime = performance.now();
            this._loop(this.lastTime);
        }
    }

    reset() {
        this.status = 'paused';
        if (this.animFrameId) {
            cancelAnimationFrame(this.animFrameId);
            this.animFrameId = null;
        }
        this.init();
        this.selectionPanel = null;
        this.movingPiece = null;
        if (this.dragManager) this.dragManager.cancelDrag();
        this.gameWon = false;
        this.render();
        this._updateUI();
    }

    _loop(timestamp) {
        if (this.status !== 'running') return;
        const dt = Math.min(timestamp - this.lastTime, 32);
        this.lastTime = timestamp;
        this.update(dt);
        this.render();
        this.animFrameId = requestAnimationFrame((t) => this._loop(t));
    }

    update(dt) {
        const now = performance.now();

        // 关卡选择界面不更新游戏逻辑
        if (this.gameScreen === 'level-select') return;

        // 游戏已胜利，不再更新
        if (this.gameWon) {
            this._updateUI();
            return;
        }

        // 购买摆放阶段：跳过物理、棋子发射、敌人生成和战斗逻辑
        if (this.waveManager.phase === 'shop') {
            this._updateUI();
            return;
        }

        // === 战斗阶段逻辑 ===
        const bounds = { width: BoardConfig.width, height: BoardConfig.height };

        // 敌人生成由 WaveManager 控制
        const spawnType = this.waveManager.update(dt, this.enemies);
        if (spawnType && this.enemies.length < BalanceConfig.maxEnemies) {
            this.enemies.push(new Enemy(BoardConfig.width - BoardConfig.wallThickness - 10, BoardConfig.groundY, spawnType));
        }

        // 棋子自动发射弹球
        for (const pin of this.pinPoints) {
            if (!pin.isEmpty() && this.balls.length < BalanceConfig.maxBalls) {
                const ball = pin.chessPiece.fire(now);
                if (ball) {
                    this.balls.push(ball);
                }
            }
        }

        // 更新所有弹球
        for (const ball of this.balls) {
            if (!ball.alive) continue;
            ball.update(dt);
            Physics.checkWallCollision(ball, bounds);

            for (const pin of this.pinPoints) {
                Physics.checkPinCollision(ball, pin);
            }

            if (Physics.checkGroundCollision(ball, BoardConfig.groundY)) {
                if (ball.type && this.soldiers.length < BalanceConfig.maxSoldiers) {
                    this.soldiers.push(new Soldier(ball.x, BoardConfig.groundY, ball.type));
                }
            }
        }

        // 弹球之间碰撞
        for (let i = 0; i < this.balls.length; i++) {
            for (let j = i + 1; j < this.balls.length; j++) {
                Physics.checkBallCollision(this.balls[i], this.balls[j]);
            }
        }
        this.balls = this.balls.filter(b => b.alive);

        // 更新棋子士兵
        for (const s of this.soldiers) {
            s.update(dt, this.enemies, now);
        }

        // 更新敌人
        for (const e of this.enemies) {
            e.update(dt, this.soldiers, now);
        }

        // 战斗系统
        Combat.checkMeleeEngagement(this.soldiers, this.enemies);
        Combat.processMeleeCombat(this.soldiers, this.enemies, dt);
        Combat.processRangedAttacks(this.soldiers, this.enemies, this.projectiles, now);

        // 更新投射物
        for (const p of this.projectiles) {
            p.update(dt);
        }
        Combat.processProjectiles(this.projectiles, this.soldiers, this.enemies);

        // 计分：统计刚死亡的敌人
        for (const e of this.enemies) {
            if (!e.alive && e.score > 0) {
                this.score += e.score;
                this.shop.addGold(e.score);
                e.score = 0; // 防止重复计分
            }
        }

        // 敌人突破防线
        for (const e of this.enemies) {
            if (e.alive && e.x <= BoardConfig.wallThickness) {
                e.alive = false;
                this.breaches++;
            }
        }

        // 清理
        const cleaned = Combat.cleanup(this.soldiers, this.enemies, this.projectiles);
        this.soldiers = cleaned.soldiers;
        this.enemies = cleaned.enemies;
        this.projectiles = cleaned.projectiles;

        // 波次完成检测
        if (this.waveManager.isGameComplete(this.enemies)) {
            this.gameWon = true;
        } else if (this.waveManager.isWaveComplete(this.enemies)) {
            this.waveManager.nextWave();
        }

        this._updateUI();
    }

    _updateUI() {
        document.getElementById('soldierCount').textContent = this.soldiers.length;
        document.getElementById('enemyCount').textContent = this.enemies.length;
        document.getElementById('ballCount').textContent = this.balls.length;
        document.getElementById('score').textContent = this.score;
        document.getElementById('breaches').textContent = this.breaches;
        document.getElementById('goldCount').textContent = this.shop.getGold();
    }

    render() {
        // 关卡选择界面
        if (this.gameScreen === 'level-select') {
            this.renderer.drawLevelSelectScreen(this.stages, this.canvas);
            return;
        }

        this.renderer.clear();
        this.renderer.drawBoard();

        for (const pin of this.pinPoints) {
            const isDragSource = this.dragManager.isDragging &&
                this.dragManager.dragSource &&
                this.dragManager.dragSource.type === 'pin' &&
                this.dragManager.dragSource.pin === pin;
            const isDragTarget = this.dragManager.isDragging && pin.isEmpty();
            this.renderer.drawPinPoint(pin, isDragSource || this.movingPiece === pin, isDragTarget);
        }

        for (const ball of this.balls) {
            this.renderer.drawBall(ball);
        }

        for (const s of this.soldiers) {
            this.renderer.drawSoldier(s);
        }

        for (const e of this.enemies) {
            this.renderer.drawEnemy(e);
        }

        for (const p of this.projectiles) {
            this.renderer.drawProjectile(p);
        }

        // 棋子选择面板（保留兼容）
        if (this.selectionPanel) {
            this.renderer.drawSelectionPanel(this.selectionPanel);
        }

        // 商店面板（购买摆放阶段）
        if (this.waveManager && this.waveManager.phase === 'shop') {
            this.renderer.drawShopPanel(this.shop, this.waveManager);
        }

        // 波次信息 UI
        if (this.waveManager) {
            this.renderer.drawWaveInfo(this.waveManager, this.enemies);
        }

        // 拖拽预览
        if (this.dragManager.isDragging) {
            this.renderer.drawDragPreview(this.dragManager);
        }

        // 暂停遮罩
        if (this.status === 'paused') {
            const ctx = this.ctx;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, BoardConfig.width, BoardConfig.height);
            ctx.fillStyle = '#fff';
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('已暂停', BoardConfig.width / 2, BoardConfig.height / 2);
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#aaa';
            ctx.fillText('点击「继续」按钮恢复游戏', BoardConfig.width / 2, BoardConfig.height / 2 + 30);
        }

        // 胜利画面
        if (this.gameWon) {
            const ctx = this.ctx;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, BoardConfig.width, BoardConfig.height);
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🎉 胜利！', BoardConfig.width / 2, BoardConfig.height / 2 - 20);
            ctx.fillStyle = '#fff';
            ctx.font = '18px sans-serif';
            ctx.fillText('所有波次已击退！得分: ' + this.score, BoardConfig.width / 2, BoardConfig.height / 2 + 20);
            // 返回选关按钮
            const btnW = 160;
            const btnH = 36;
            const btnX = BoardConfig.width / 2 - btnW / 2;
            const btnY = BoardConfig.height / 2 + 50;
            ctx.fillStyle = '#5cb85c';
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 6);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText('返回选关', BoardConfig.width / 2, btnY + btnH / 2 + 5);
            this._returnToSelectBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
        } else {
            this._returnToSelectBtn = null;
        }
    }
}

// ============================================================
// 外部配置加载（从外部 JS 全局变量覆盖内置默认值）
// ============================================================
function loadConfigs() {
    if (typeof PHYSICS_CONFIG_EXTERNAL !== 'undefined') {
        Object.assign(PhysicsConfig, PHYSICS_CONFIG_EXTERNAL);
    }
    if (typeof BALANCE_CONFIG_EXTERNAL !== 'undefined') {
        Object.assign(BalanceConfig, BALANCE_CONFIG_EXTERNAL);
    }
    if (typeof LEVEL_CONFIG_EXTERNAL !== 'undefined') {
        Object.assign(LevelConfig, LEVEL_CONFIG_EXTERNAL);
    }
    if (typeof PIECE_CONFIG_EXTERNAL !== 'undefined') {
        PIECE_TYPES = PIECE_CONFIG_EXTERNAL;
        PIECE_TYPE_LIST = Object.values(PIECE_TYPES);
    }
    if (typeof ENEMY_CONFIG_EXTERNAL !== 'undefined') {
        ENEMY_TYPES = ENEMY_CONFIG_EXTERNAL;
        ENEMY_TYPE_LIST = Object.values(ENEMY_TYPES);
    }
    if (typeof WAVE_CONFIG_EXTERNAL !== 'undefined') {
        WAVE_CONFIGS = WAVE_CONFIG_EXTERNAL;
    }
    // 加载关卡配置
    if (typeof STAGES_CONFIG_EXTERNAL !== 'undefined' && Array.isArray(STAGES_CONFIG_EXTERNAL) && STAGES_CONFIG_EXTERNAL.length > 0) {
        game.stages = STAGES_CONFIG_EXTERNAL;
    } else {
        // 回退：用现有配置构造默认单关卡
        game.stages = [{
            id: 1,
            name: '默认关卡',
            boardConfig: typeof BOARD_CONFIG_EXTERNAL !== 'undefined' ? Object.assign({}, BOARD_CONFIG_EXTERNAL) : Object.assign({}, BoardConfig),
            waveConfig: WAVE_CONFIGS.slice()
        }];
    }
}

// ============================================================
// 初始化
// ============================================================
const canvas = document.getElementById('gameCanvas');
const game = new Game(canvas);

loadConfigs();
game.gameScreen = 'level-select';
game.render();

// 按钮事件
document.getElementById('btn-pause').addEventListener('click', () => game.pause());
document.getElementById('btn-resume').addEventListener('click', () => game.resume());
document.getElementById('btn-reset').addEventListener('click', () => { game.returnToLevelSelect(); });
document.getElementById('btn-back').addEventListener('click', () => { game.returnToLevelSelect(); });

// 点击交互：商店购买、棋子放置/移除、发射器
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // 关卡选择界面点击
    if (game.gameScreen === 'level-select') {
        if (game.renderer._stageButtons) {
            for (const btn of game.renderer._stageButtons) {
                if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
                    game.selectStage(btn.index);
                    game.start();
                    return;
                }
            }
        }
        return;
    }

    // 胜利画面 "返回选关" 按钮
    if (game.gameWon && game._returnToSelectBtn) {
        const rb = game._returnToSelectBtn;
        if (mx >= rb.x && mx <= rb.x + rb.w && my >= rb.y && my <= rb.y + rb.h) {
            game.returnToLevelSelect();
            return;
        }
    }

    const isShopPhase = game.waveManager && game.waveManager.phase === 'shop';

    // 商店面板 "开始战斗" 按钮（仅购买摆放阶段，且不在拖拽中）
    if (isShopPhase && !game.dragManager.isDragging && game.renderer._startCombatBtn) {
        const sb = game.renderer._startCombatBtn;
        if (mx >= sb.x && mx <= sb.x + sb.w && my >= sb.y && my <= sb.y + sb.h) {
            game.shop.clearSelection();
            game.selectionPanel = null;
            game.waveManager.startCombatPhase();
            return;
        }
    }
});

// 拖拽交互：mousedown/mousemove/mouseup
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // 关卡选择界面不处理拖拽
    if (game.gameScreen === 'level-select') return;

    const isShopPhase = game.waveManager && game.waveManager.phase === 'shop';

    // 检查"开始战斗"按钮（不启动拖拽）
    if (isShopPhase && game.renderer._startCombatBtn) {
        const sb = game.renderer._startCombatBtn;
        if (mx >= sb.x && mx <= sb.x + sb.w && my >= sb.y && my <= sb.y + sb.h) {
            return; // 由 click 事件处理
        }
    }

    // 检查商店棋子按钮 → 开始从商店拖拽
    if (isShopPhase && game.renderer._shopButtons) {
        for (const btn of game.renderer._shopButtons) {
            if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
                if (btn.affordable) {
                    game.dragManager.startDragFromShop(btn.type);
                    game.dragManager.updateDragPosition(mx, my);
                }
                return;
            }
        }
    }

    // 检查点位棋子 → 开始从点位拖拽
    for (const pin of game.pinPoints) {
        const dx = mx - pin.x;
        const dy = my - pin.y;
        if (dx * dx + dy * dy <= (pin.radius + 6) * (pin.radius + 6)) {
            if (!pin.isEmpty()) {
                game.dragManager.startDragFromPin(pin);
                game.dragManager.updateDragPosition(mx, my);
            }
            return;
        }
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    game._mousePos = { x: mx, y: my };

    if (game.dragManager.isDragging) {
        game.dragManager.updateDragPosition(mx, my);
    }
});

canvas.addEventListener('mouseup', (e) => {
    if (!game.dragManager.isDragging) return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // 判断是否在商店区域释放
    const shopPanelW = 160;
    const shopPanelX = BoardConfig.width - shopPanelW - 4;
    const isShopPhase = game.waveManager && game.waveManager.phase === 'shop';
    const isInShopArea = isShopPhase && mx >= shopPanelX && mx <= BoardConfig.width && my >= 4 && my <= 300;

    // 查找目标点位
    let targetPin = null;
    for (const pin of game.pinPoints) {
        const dx = mx - pin.x;
        const dy = my - pin.y;
        if (dx * dx + dy * dy <= (pin.radius + 6) * (pin.radius + 6)) {
            targetPin = pin;
            break;
        }
    }

    game.dragManager.endDrag(targetPin, isInShopArea);
});

</script>
